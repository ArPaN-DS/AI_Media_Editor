name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  repository-health:
    name: Repository privacy and architecture inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check private artifacts and recognizable secrets
        run: python scripts/check_repository_hygiene.py --history
      - name: Check architecture inventory is current
        run: python scripts/update_architecture.py --check

  lint:
    name: Lint Python (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8 linter
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=venv,audio_cutter,.git,models,uploads,processed,data,user_skills
          # warn on other style issues (max line length 120)
          flake8 . --count --max-line-length=120 --statistics \
            --exclude=venv,audio_cutter,.git,models,uploads,processed,data,user_skills \
            --exit-zero
