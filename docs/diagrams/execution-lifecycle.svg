<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="992" viewBox="0 0 1290 992" role="img" aria-labelledby="svg-title svg-description"><title id="svg-title">Media Studio — Validate. Execute. Verify. Recover.</title><desc id="svg-description">A failure stops its dependents while independent branches can still produce useful results. Select components in the interactive explorer for implementation details.</desc><defs><pattern id="canvas-dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#a9bcd6" opacity=".14"/></pattern><marker id="arrow-client" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#12647b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-gateway" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#3d5eaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-copilot" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#7151ac" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-engine" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#9c4938" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-resource" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#805f15" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-storage" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#226b53" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-external" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#53647e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#eef3fb"/><g font-family="Segoe UI,Helvetica,Arial,sans-serif"><text x="38" y="35" fill="#526985" font-size="11" font-weight="600" letter-spacing="1.2">MEDIA STUDIO / ENGINEERING ATLAS</text><text x="38" y="76" fill="#243b5b" font-size="30" font-weight="650" letter-spacing="-.7">Validate. Execute. Verify. Recover.</text><text x="38" y="103" fill="#526985" font-size="13">A failure stops its dependents while independent branches can still produce useful results.</text><g id="scene" transform="translate(0,126)"><rect width="1290" height="790" fill="url(#canvas-dots)"/><text x="38" y="38" fill="#526985" font-size="10" font-weight="500" letter-spacing="1.1">DEPENDENCY-AWARE EXECUTION</text><text x="1252" y="38" text-anchor="end" fill="#526985" font-size="10">MEDIA STUDIO</text><g class="diagram-region"><path d="M42 135H1248" stroke="#cfdaeb" stroke-width="1"/><text x="44" y="119" font-size="12" font-weight="600" fill="#526985">Execution path</text></g><g class="diagram-region"><path d="M356 462H1248" stroke="#cfdaeb" stroke-width="1"/><text x="358" y="446" font-size="12" font-weight="600" fill="#526985">Recovery and results</text></g><g id="connections"><g class="diagram-edge" data-from="graph" data-to="actualInput"><path d="M228,210 L422,210" fill="none" stroke="#7151ac" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-copilot)"/></g><g class="diagram-edge" data-from="actualInput" data-to="executor"><path d="M536,210 L730,210" fill="none" stroke="#7151ac" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-copilot)"/></g><g class="diagram-edge" data-from="executor" data-to="verify"><path d="M844,210 L1038,210" fill="none" stroke="#9c4938" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-engine)"/></g><g class="diagram-edge" data-from="governor" data-to="executor"><path d="M171,483 L171,404 Q171,392 183,392 L775,392 Q787,392 787,380 L787,294" fill="none" stroke="#805f15" stroke-opacity=".75" stroke-width="1.65" stroke-dasharray="5 6" marker-end="url(#arrow-resource)"/><rect x="380.4" y="369" width="221.20000000000002" height="19" rx="4" fill="#eef3fb"/><text x="491" y="382" text-anchor="middle" font-size="9.5" fill="#526985">Processor admission + model sessions</text></g><g class="diagram-edge" data-from="verify" data-to="artifacts"><path d="M1095,294 L1095,483" fill="none" stroke="#9c4938" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-engine)"/><rect x="1064.2" y="393" width="61.6" height="19" rx="4" fill="#eef3fb"/><text x="1095" y="406" text-anchor="middle" font-size="9.5" fill="#526985">Verified</text></g><g class="diagram-edge" data-from="verify" data-to="recovery"><path d="M1095,294 L1095,367 Q1095,379 1083,379 L799,379 Q787,379 787,391 L787,483" fill="none" stroke="#9c4938" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-engine)"/><rect x="885.85" y="355" width="124.3" height="19" rx="4" fill="#eef3fb"/><text x="948" y="368" text-anchor="middle" font-size="9.5" fill="#526985">Failure / exception</text></g><g class="diagram-edge" data-from="recovery" data-to="executor"><path d="M844,520 L934,520 Q946,520 946,508 L946,222 Q946,210 934,210 L844,210" fill="none" stroke="#805f15" stroke-opacity=".75" stroke-width="1.65" stroke-dasharray="5 6" marker-end="url(#arrow-resource)"/><rect x="893.4" y="418" width="107.2" height="19" rx="4" fill="#eef3fb"/><text x="947" y="431" text-anchor="middle" font-size="9.5" fill="#526985">Retry / fallback</text></g><g class="diagram-edge" data-from="recovery" data-to="artifacts"><path d="M844,520 L1038,520" fill="none" stroke="#805f15" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-resource)"/><rect x="892.4" y="520" width="107.2" height="19" rx="4" fill="#eef3fb"/><text x="946" y="533" text-anchor="middle" font-size="9.5" fill="#526985">Partial / failed</text></g></g><g id="components"><g class="diagram-node" data-node="graph"  transform="translate(52,180)" style="cursor:pointer"><title>Normalize plan steps into explicit input references and follow the graph in a sequential loop. Main output lineage and branch outputs are tracked independently.</title><rect class="node-body" width="238" height="110" fill="transparent"/><ellipse class="node-selection" cx="119" cy="29" rx="62" ry="39" fill="none" stroke="#7151ac" stroke-width="2" opacity="0"/><svg x="93" y="5" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#7151ac" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-5h14v5"/></svg><text x="119" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Resolve dependencies</text><text x="119" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Source IDs, input lineage and branches</text></g><g class="diagram-node" data-node="actualInput"  transform="translate(360,180)" style="cursor:pointer"><title>Resolve the step input and inspect its real properties. Revalidate the operation against that media before dispatch rather than trusting client or model claims.</title><rect class="node-body" width="238" height="110" fill="transparent"/><ellipse class="node-selection" cx="119" cy="29" rx="62" ry="39" fill="none" stroke="#7151ac" stroke-width="2" opacity="0"/><circle cx="114" cy="23" r="21" fill="#f0eaff" stroke="#7151ac" stroke-width="1.7" stroke-linejoin="round"/><path d="m130 40 18 16M104 23h20m-10-10v20" fill="none" stroke="#7151ac" stroke-width="2.7" stroke-linecap="round"/><text x="119" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Inspect actual input</text><text x="119" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Strict per-step revalidation</text></g><g class="diagram-node" data-node="executor"  transform="translate(668,180)" style="cursor:pointer"><title>Four Python sub-agent classes dispatch approved operations, revalidate actual inputs, verify selected outputs and preserve main-chain and branch artifacts.</title><rect class="node-body" width="238" height="110" fill="transparent"/><ellipse class="node-selection" cx="119" cy="29" rx="62" ry="39" fill="none" stroke="#9c4938" stroke-width="2" opacity="0"/><path d="M119 25V8m0 17-27 20m27-20 27 20" fill="none" stroke="#9c4938" stroke-width="2"/><circle cx="119" cy="27" r="11" fill="#fff0eb" stroke="#9c4938" stroke-width="1.7" stroke-linejoin="round"/><circle cx="119" cy="5" r="6" fill="#fff0eb" stroke="#9c4938" stroke-width="1.7" stroke-linejoin="round"/><circle cx="91" cy="48" r="7" fill="#fff0eb" stroke="#9c4938" stroke-width="1.7" stroke-linejoin="round"/><circle cx="147" cy="48" r="7" fill="#fff0eb" stroke="#9c4938" stroke-width="1.7" stroke-linejoin="round"/><text x="119" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Specialist execution</text><text x="119" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Audio · Video · Vision · Inspector</text></g><g class="diagram-node" data-node="verify"  transform="translate(976,180)" style="cursor:pointer"><title>Verify selected output properties, including file existence, readable image data, unexpected silence and audio removal for muted-video output.</title><rect class="node-body" width="238" height="110" fill="transparent"/><ellipse class="node-selection" cx="119" cy="29" rx="62" ry="39" fill="none" stroke="#9c4938" stroke-width="2" opacity="0"/><circle cx="119" cy="29" r="27" fill="#fff0eb" stroke="#9c4938" stroke-width="1.7" stroke-linejoin="round"/><path d="m106 29 9 9 18-20" fill="none" stroke="#9c4938" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Verify output</text><text x="119" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Existence, readability and signal checks</text></g><g class="diagram-node" data-node="governor"  transform="translate(52,490)" style="cursor:pointer"><title>Coordinates governed processing work using admission classes, resource reservations, adaptive variant selection, failure cooldowns and a single active managed heavy-model session.</title><rect class="node-body" width="238" height="110" fill="transparent"/><ellipse class="node-selection" cx="119" cy="29" rx="62" ry="39" fill="none" stroke="#805f15" stroke-width="2" opacity="0"/><rect x="96" y="6" width="46" height="46" rx="6" fill="#fff5d9" stroke="#805f15" stroke-width="1.7" stroke-linejoin="round"/><rect x="107" y="17" width="24" height="24" rx="3" fill="none" stroke="#805f15" stroke-width="1.5"/><path d="M107 0v6m0 46v6M90 17h6m46 0h6" stroke="#805f15" stroke-width="2"/><path d="M119 0v6m0 46v6M90 29h6m46 0h6" stroke="#805f15" stroke-width="2"/><path d="M131 0v6m0 46v6M90 41h6m46 0h6" stroke="#805f15" stroke-width="2"/><text x="119" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Resource governor</text><text x="119" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Admission, budgets and model lifecycle</text></g><g class="diagram-node" data-node="recovery"  transform="translate(668,490)" style="cursor:pointer"><title>Selected transient failures receive a retry. Explicit planned fallbacks and adaptive variant demotion can recover supported errors. Low-confidence transcription can retry with enhancement.</title><rect class="node-body" width="238" height="110" fill="transparent"/><ellipse class="node-selection" cx="119" cy="29" rx="62" ry="39" fill="none" stroke="#805f15" stroke-width="2" opacity="0"/><path d="M98 16a26 26 0 1 1-3 27m3-27-1 17m1-17 17 1" fill="none" stroke="#805f15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Retry or fallback</text><text x="119" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Selected transient failures / variants</text></g><g class="diagram-node" data-node="artifacts"  transform="translate(976,490)" style="cursor:pointer"><title>Return the main-chain output separately from branch exports such as stems, transcripts or thumbnails. The browser previews or downloads files from the processed-media endpoint.</title><rect class="node-body" width="238" height="110" fill="transparent"/><ellipse class="node-selection" cx="119" cy="29" rx="62" ry="39" fill="none" stroke="#226b53" stroke-width="2" opacity="0"/><path d="M76 15V7H106L114 15H161V55H76Z" fill="#e3f6ee" stroke="#226b53" stroke-width="1.7" stroke-linejoin="round"/><path d="M76 22H161L154 56H76Z" fill="#e3f6ee" stroke="#226b53" stroke-width="1.7" stroke-linejoin="round"/><path d="M105 31H132m-27 8h21m-21 8h14" stroke="#226b53" stroke-width="2" stroke-linecap="round"/><text x="119" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Preview &amp; download</text><text x="119" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Main output + side artifacts</text></g></g></g><rect x="38" y="938" width="7" height="7" rx="2" fill="#7151ac"/><text x="52" y="945" font-size="10" fill="#526985">Intelligence</text><rect x="149.2" y="938" width="7" height="7" rx="2" fill="#9c4938"/><text x="163.2" y="945" font-size="10" fill="#526985">Media engine</text><rect x="260.4" y="938" width="7" height="7" rx="2" fill="#805f15"/><text x="274.4" y="945" font-size="10" fill="#526985">Resources</text><rect x="353.29999999999995" y="938" width="7" height="7" rx="2" fill="#226b53"/><text x="367.29999999999995" y="945" font-size="10" fill="#526985">Persistence</text><text x="38" y="977" font-size="10" fill="#526985">Sequential graph traversal · selected retries · verified main and branch artifacts</text></g></svg>