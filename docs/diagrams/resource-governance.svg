<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1012" viewBox="0 0 1320 1012" role="img" aria-labelledby="svg-title svg-description"><title id="svg-title">Media Studio — Quality that respects the machine.</title><desc id="svg-description">Live headroom, reservations and learned runtime budgets shape which variant runs. Select components in the interactive explorer for implementation details.</desc><defs><pattern id="canvas-dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#a9bcd6" opacity=".14"/></pattern><marker id="arrow-client" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#12647b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-gateway" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#3d5eaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-copilot" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#7151ac" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-engine" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#9c4938" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-resource" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#805f15" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-storage" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#226b53" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-external" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#53647e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#eef3fb"/><g font-family="Segoe UI,Helvetica,Arial,sans-serif"><text x="38" y="35" fill="#526985" font-size="11" font-weight="600" letter-spacing="1.2">MEDIA STUDIO / ENGINEERING ATLAS</text><text x="38" y="76" fill="#243b5b" font-size="30" font-weight="650" letter-spacing="-.7">Quality that respects the machine.</text><text x="38" y="103" fill="#526985" font-size="13">Live headroom, reservations and learned runtime budgets shape which variant runs.</text><g id="scene" transform="translate(0,126)"><rect width="1320" height="810" fill="url(#canvas-dots)"/><text x="38" y="38" fill="#526985" font-size="10" font-weight="500" letter-spacing="1.1">CAPACITY-AWARE PROCESSING</text><text x="1282" y="38" text-anchor="end" fill="#526985" font-size="10">MEDIA STUDIO</text><g class="diagram-region"><path d="M42 129H1278" stroke="#cfdaeb" stroke-width="1"/><text x="44" y="113" font-size="12" font-weight="600" fill="#526985">Plan for capacity</text></g><g class="diagram-region"><path d="M42 467H1278" stroke="#cfdaeb" stroke-width="1"/><text x="44" y="451" font-size="12" font-weight="600" fill="#526985">Run, learn &amp; release</text></g><g id="connections"><g class="diagram-edge" data-from="snapshot" data-to="quality"><path d="M236,204 L436,204" fill="none" stroke="#805f15" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-resource)"/></g><g class="diagram-edge" data-from="quality" data-to="admission"><path d="M550,204 L750,204" fill="none" stroke="#805f15" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-resource)"/></g><g class="diagram-edge" data-from="admission" data-to="modelSession"><path d="M864,204 L1064,204" fill="none" stroke="#805f15" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-resource)"/></g><g class="diagram-edge" data-from="modelSession" data-to="executeVariant"><path d="M1121,288 L1121,503" fill="none" stroke="#9c4938" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-engine)"/></g><g class="diagram-edge" data-from="executeVariant" data-to="learning"><path d="M1064,540 L864,540" fill="none" stroke="#9c4938" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-engine)"/><rect x="935.05" y="536" width="55.9" height="19" rx="4" fill="#eef3fb"/><text x="963" y="549" text-anchor="middle" font-size="9.5" fill="#526985">Success</text></g><g class="diagram-edge" data-from="learning" data-to="release"><path d="M750,540 L550,540" fill="none" stroke="#7151ac" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-copilot)"/></g><g class="diagram-edge" data-from="executeVariant" data-to="release"><path d="M1178,540 L1260,540 Q1272,540 1272,552 L1272,756 Q1272,768 1260,768 L505,768 Q493,768 493,756 L493,624" fill="none" stroke="#9c4938" stroke-opacity=".75" stroke-width="1.65" stroke-dasharray="5 6" marker-end="url(#arrow-engine)"/><rect x="797.05" y="744" width="169.9" height="19" rx="4" fill="#eef3fb"/><text x="882" y="757" text-anchor="middle" font-size="9.5" fill="#526985">Unrecovered error / release</text></g><g class="diagram-edge" data-from="executeVariant" data-to="cooldown"><path d="M1121,624 L1121,707 Q1121,719 1109,719 L191,719 Q179,719 179,707 L179,624" fill="none" stroke="#9c4938" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-engine)"/><rect x="537.55" y="694" width="226.9" height="19" rx="4" fill="#eef3fb"/><text x="651" y="707" text-anchor="middle" font-size="9.5" fill="#526985">Resource failure → demote / cool down</text></g><g class="diagram-edge" data-from="cooldown" data-to="admission"><path d="M179,503 L179,402 Q179,390 191,390 L795,390 Q807,390 807,378 L807,288" fill="none" stroke="#805f15" stroke-opacity=".75" stroke-width="1.65" stroke-dasharray="5 6" marker-end="url(#arrow-resource)"/><rect x="396.65" y="367" width="192.70000000000002" height="19" rx="4" fill="#eef3fb"/><text x="493" y="380" text-anchor="middle" font-size="9.5" fill="#526985">Try eligible lower-cost variant</text></g></g><g id="components"><g class="diagram-node" data-node="snapshot"  transform="translate(56,174)" style="cursor:pointer"><title>Probe the current resource picture and subtract concurrent governed reservations before selecting a capability variant.</title><rect class="node-body" width="246" height="110" fill="transparent"/><ellipse class="node-selection" cx="123" cy="29" rx="62" ry="39" fill="none" stroke="#805f15" stroke-width="2" opacity="0"/><rect x="100" y="6" width="46" height="46" rx="6" fill="#fff5d9" stroke="#805f15" stroke-width="1.7" stroke-linejoin="round"/><rect x="111" y="17" width="24" height="24" rx="3" fill="none" stroke="#805f15" stroke-width="1.5"/><path d="M111 0v6m0 46v6M94 17h6m46 0h6" stroke="#805f15" stroke-width="2"/><path d="M123 0v6m0 46v6M94 29h6m46 0h6" stroke="#805f15" stroke-width="2"/><path d="M135 0v6m0 46v6M94 41h6m46 0h6" stroke="#805f15" stroke-width="2"/><text x="123" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Measure headroom</text><text x="123" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">CPU, free RAM and GPU memory</text></g><g class="diagram-node" data-node="quality"  transform="translate(370,174)" style="cursor:pointer"><title>Select eligible variants beneath the operator quality ceiling, considering available capacity, learned runtime per work unit and temporarily demoted variants.</title><rect class="node-body" width="246" height="110" fill="transparent"/><ellipse class="node-selection" cx="123" cy="29" rx="62" ry="39" fill="none" stroke="#805f15" stroke-width="2" opacity="0"/><path d="M87 57h72" stroke="#805f15" stroke-width="1.8"/><rect x="93" y="36" width="14" height="17" rx="2" fill="#805f15" opacity=".5"/><rect x="116" y="21" width="14" height="32" rx="2" fill="#805f15" opacity=".75"/><rect x="139" y="5" width="14" height="48" rx="2" fill="#805f15"/><text x="123" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Choose quality ladder</text><text x="123" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Capacity × budget × failure cooldown</text></g><g class="diagram-node" data-node="admission"  transform="translate(684,174)" style="cursor:pointer"><title>Governed operations obtain resource admission before entering managed model sessions. Reservations coordinate demand among concurrent governed jobs.</title><rect class="node-body" width="246" height="110" fill="transparent"/><ellipse class="node-selection" cx="123" cy="29" rx="62" ry="39" fill="none" stroke="#805f15" stroke-width="2" opacity="0"/><rect x="100" y="6" width="46" height="46" rx="6" fill="#fff5d9" stroke="#805f15" stroke-width="1.7" stroke-linejoin="round"/><rect x="111" y="17" width="24" height="24" rx="3" fill="none" stroke="#805f15" stroke-width="1.5"/><path d="M111 0v6m0 46v6M94 17h6m46 0h6" stroke="#805f15" stroke-width="2"/><path d="M123 0v6m0 46v6M94 29h6m46 0h6" stroke="#805f15" stroke-width="2"/><path d="M135 0v6m0 46v6M94 41h6m46 0h6" stroke="#805f15" stroke-width="2"/><text x="123" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Reserve &amp; admit</text><text x="123" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">CPU / encode / GPU / model classes</text></g><g class="diagram-node" data-node="modelSession"  transform="translate(998,174)" style="cursor:pointer"><title>Load a managed heavy model for the operation under the shared lifecycle lock. This prevents multiple managed heavy models from coexisting within that manager.</title><rect class="node-body" width="246" height="110" fill="transparent"/><ellipse class="node-selection" cx="123" cy="29" rx="62" ry="39" fill="none" stroke="#9c4938" stroke-width="2" opacity="0"/><rect x="100" y="6" width="46" height="46" rx="6" fill="#fff0eb" stroke="#9c4938" stroke-width="1.7" stroke-linejoin="round"/><rect x="111" y="17" width="24" height="24" rx="3" fill="none" stroke="#9c4938" stroke-width="1.5"/><path d="M111 0v6m0 46v6M94 17h6m46 0h6" stroke="#9c4938" stroke-width="2"/><path d="M123 0v6m0 46v6M94 29h6m46 0h6" stroke="#9c4938" stroke-width="2"/><path d="M135 0v6m0 46v6M94 41h6m46 0h6" stroke="#9c4938" stroke-width="2"/><text x="123" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Managed model session</text><text x="123" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Single active heavy-model mutex</text></g><g class="diagram-node" data-node="executeVariant"  transform="translate(998,510)" style="cursor:pointer"><title>Execute the selected processor variant with its current resource reservation. Output verification happens in the media execution path where applicable.</title><rect class="node-body" width="246" height="110" fill="transparent"/><ellipse class="node-selection" cx="123" cy="29" rx="62" ry="39" fill="none" stroke="#9c4938" stroke-width="2" opacity="0"/><rect x="79" y="5" width="33" height="43" rx="4" fill="#fff0eb" stroke="#9c4938" stroke-width="1.7" stroke-linejoin="round"/><path d="m87 28 6-6 9 12m-22-20h3m-3 25h3" fill="none" stroke="#9c4938" stroke-width="1.5"/><rect x="115" y="15" width="50" height="38" rx="4" fill="#fff0eb" stroke="#9c4938" stroke-width="1.7" stroke-linejoin="round"/><path d="m135 25 12 9-12 9Z" fill="#9c4938"/><path d="M91 56h70" stroke="#9c4938" stroke-width="1.5"/><text x="123" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Run selected variant</text><text x="123" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Workload-aware capability execution</text></g><g class="diagram-node" data-node="learning"  transform="translate(684,510)" style="cursor:pointer"><title>Successful runs update an exponentially weighted moving average of runtime per input work unit to inform later budget-aware variant selection.</title><rect class="node-body" width="246" height="110" fill="transparent"/><ellipse class="node-selection" cx="123" cy="29" rx="62" ry="39" fill="none" stroke="#7151ac" stroke-width="2" opacity="0"/><path d="M87 57h72" stroke="#7151ac" stroke-width="1.8"/><rect x="93" y="36" width="14" height="17" rx="2" fill="#7151ac" opacity=".5"/><rect x="116" y="21" width="14" height="32" rx="2" fill="#7151ac" opacity=".75"/><rect x="139" y="5" width="14" height="48" rx="2" fill="#7151ac"/><text x="123" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Learn runtime cost</text><text x="123" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">EWMA seconds per work unit</text></g><g class="diagram-node" data-node="release"  transform="translate(370,510)" style="cursor:pointer"><title>Release reservations and managed model memory after the operation. Optional short keepalive can retain a model for bursts when sufficient headroom is available; weights remain on disk.</title><rect class="node-body" width="246" height="110" fill="transparent"/><ellipse class="node-selection" cx="123" cy="29" rx="62" ry="39" fill="none" stroke="#226b53" stroke-width="2" opacity="0"/><path d="M80 15V7H110L118 15H165V55H80Z" fill="#e3f6ee" stroke="#226b53" stroke-width="1.7" stroke-linejoin="round"/><path d="M80 22H165L158 56H80Z" fill="#e3f6ee" stroke="#226b53" stroke-width="1.7" stroke-linejoin="round"/><path d="M109 31H136m-27 8h21m-21 8h14" stroke="#226b53" stroke-width="2" stroke-linecap="round"/><text x="123" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Release resources</text><text x="123" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Offload now, or brief optional reuse</text></g><g class="diagram-node" data-node="cooldown"  transform="translate(56,510)" style="cursor:pointer"><title>Record resource-related variant failure and apply a cooldown before attempting an eligible lower-cost variant. This avoids repeatedly selecting the same failing heavy configuration.</title><rect class="node-body" width="246" height="110" fill="transparent"/><ellipse class="node-selection" cx="123" cy="29" rx="62" ry="39" fill="none" stroke="#805f15" stroke-width="2" opacity="0"/><path d="M102 16a26 26 0 1 1-3 27m3-27-1 17m1-17 17 1" fill="none" stroke="#805f15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="123" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Demote failed variant</text><text x="123" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Resource failures trigger cooldown</text></g></g></g><rect x="38" y="958" width="7" height="7" rx="2" fill="#805f15"/><text x="52" y="965" font-size="10" fill="#526985">Resources</text><rect x="130.9" y="958" width="7" height="7" rx="2" fill="#9c4938"/><text x="144.9" y="965" font-size="10" fill="#526985">Media engine</text><rect x="242.1" y="958" width="7" height="7" rx="2" fill="#7151ac"/><text x="256.1" y="965" font-size="10" fill="#526985">Intelligence</text><rect x="353.29999999999995" y="958" width="7" height="7" rx="2" fill="#226b53"/><text x="367.29999999999995" y="965" font-size="10" fill="#526985">Persistence</text><text x="38" y="997" font-size="10" fill="#526985">Coordination covers governed paths in one process. The separate model service owns its allocations.</text></g></svg>