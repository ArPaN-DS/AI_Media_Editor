<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="972" viewBox="0 0 1240 972" role="img" aria-labelledby="svg-title svg-description"><title id="svg-title">Media Studio — Local work. Explicit boundaries.</title><desc id="svg-description">See what runs on the user-controlled host and where optional external connections exist. Select components in the interactive explorer for implementation details.</desc><defs><pattern id="canvas-dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#a9bcd6" opacity=".14"/></pattern><marker id="arrow-client" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#12647b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-gateway" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#3d5eaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-copilot" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#7151ac" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-engine" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#9c4938" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-resource" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#805f15" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-storage" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#226b53" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-external" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#53647e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#eef3fb"/><g font-family="Segoe UI,Helvetica,Arial,sans-serif"><text x="38" y="35" fill="#526985" font-size="11" font-weight="600" letter-spacing="1.2">MEDIA STUDIO / ENGINEERING ATLAS</text><text x="38" y="76" fill="#243b5b" font-size="30" font-weight="650" letter-spacing="-.7">Local work. Explicit boundaries.</text><text x="38" y="103" fill="#526985" font-size="13">See what runs on the user-controlled host and where optional external connections exist.</text><g id="scene" transform="translate(0,126)"><rect width="1240" height="770" fill="url(#canvas-dots)"/><text x="38" y="38" fill="#526985" font-size="10" font-weight="500" letter-spacing="1.1">SYSTEM BOUNDARIES</text><text x="1202" y="38" text-anchor="end" fill="#526985" font-size="10">MEDIA STUDIO</text><g class="diagram-region"><rect x="352" y="238" width="862" height="504" rx="16" fill="none" stroke="#cfdaeb" stroke-width="1" stroke-dasharray="5 6"/><text x="370" y="265" font-size="12" font-weight="600" fill="#526985">User-controlled host</text><text x="1196" y="265" text-anchor="end" font-size="9" fill="#526985">Trusted single-user environment</text></g><g id="connections"><g class="diagram-edge" data-from="browser" data-to="gateway"><path d="M220,335 L498,335" fill="none" stroke="#12647b" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-client)"/><rect x="259.6" y="334" width="152.8" height="19" rx="4" fill="#eef3fb"/><text x="336" y="347" text-anchor="middle" font-size="9.5" fill="#526985">Upload / edit / download</text></g><g class="diagram-edge" data-from="publishers" data-to="gateway"><path d="M555,198 L555,298" fill="none" stroke="#53647e" stroke-opacity=".75" stroke-width="1.65" stroke-dasharray="5 6" marker-end="url(#arrow-external)"/><rect x="498.55" y="219" width="112.9" height="19" rx="4" fill="#eef3fb"/><text x="555" y="232" text-anchor="middle" font-size="9.5" fill="#526985">Installation only</text></g><g class="diagram-edge" data-from="gateway" data-to="storage"><path d="M612,335 L1006,335" fill="none" stroke="#3d5eaa" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-gateway)"/><rect x="773.95" y="351" width="90.10000000000001" height="19" rx="4" fill="#eef3fb"/><text x="819" y="364" text-anchor="middle" font-size="9.5" fill="#526985">Private files</text></g><g class="diagram-edge" data-from="gateway" data-to="modelService"><path d="M555,449 L555,541" fill="none" stroke="#3d5eaa" stroke-opacity=".75" stroke-width="1.65" stroke-dasharray="5 6" marker-end="url(#arrow-gateway)"/><rect x="501.4" y="487" width="107.2" height="19" rx="4" fill="#eef3fb"/><text x="555" y="500" text-anchor="middle" font-size="9.5" fill="#526985">Loopback prompts</text></g><g class="diagram-edge" data-from="gateway" data-to="postgres"><path d="M612,335 L846,335 Q858,335 858,323 L858,126 Q858,114 870,114 L1006,114" fill="none" stroke="#3d5eaa" stroke-opacity=".75" stroke-width="1.65" stroke-dasharray="5 6" marker-end="url(#arrow-gateway)"/><rect x="804.25" y="205" width="101.5" height="19" rx="4" fill="#eef3fb"/><text x="855" y="218" text-anchor="middle" font-size="9.5" fill="#526985">Opt-in metadata</text></g></g><g id="components"><g class="diagram-node" data-node="browser"  transform="translate(46,305)" style="cursor:pointer"><title>Manual media editing, playback, waveform and timeline controls, plus the copilot interface. Suitable canvas edits can stay in the browser; advanced operations upload selected media to the application host.</title><rect class="node-body" width="234" height="128" fill="transparent"/><ellipse class="node-selection" cx="117" cy="29" rx="62" ry="39" fill="none" stroke="#12647b" stroke-width="2" opacity="0"/><rect x="69" y="2" width="96" height="55" rx="5" fill="#e3f5fb" stroke="#12647b" stroke-width="1.7" stroke-linejoin="round"/><path d="M69 15H165" stroke="#12647b" stroke-width="1.3"/><circle cx="78" cy="9" r="1.6" fill="#12647b"/><circle cx="84" cy="9" r="1.6" fill="#12647b"/><circle cx="90" cy="9" r="1.6" fill="#12647b"/><svg x="104" y="23" width="26" height="26" viewBox="0 0 24 24" fill="#12647b" aria-hidden="true"><path d="M1.5 0h21l-1.91 21.563L11.977 24l-8.564-2.438L1.5 0zm7.031 9.75l-.232-2.718 10.059.003.23-2.622L5.412 4.41l.698 8.01h9.126l-.326 3.426-2.91.804-2.955-.81-.188-2.11H6.248l.33 4.171L12 19.351l5.379-1.443.744-8.157H8.531z"/></svg><text x="117" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Browser studios</text><text x="117" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Audio · video · image · unified studio</text></g><g class="diagram-node" data-node="gateway"  transform="translate(410,305)" style="cursor:pointer"><title>The application entry point loads private configuration, establishes file locations, saves projects, serves artifacts and applies public response guards. Four blueprints handle domain operations.</title><rect class="node-body" width="290" height="140" fill="transparent"/><ellipse class="node-selection" cx="145" cy="29" rx="62" ry="39" fill="none" stroke="#3d5eaa" stroke-width="2" opacity="0"/><svg x="116" y="0" width="58" height="58" viewBox="0 0 24 24" fill="#202d3e" aria-hidden="true"><path d="M10.773 2.878c-.013 1.434.322 4.624.445 5.734l-8.558 3.83c-.56-.959-.98-2.304-1.237-3.38l-.06.027c-.205.09-.406.053-.494-.088l-.011-.018-.82-1.506c-.058-.105-.05-.252.024-.392a.78.78 0 0 1 .358-.331l9.824-4.207c.146-.064.299-.063.4.004.106.062.127.128.13.327Zm.68 7c.523 1.97.675 2.412.832 2.818l-7.263 3.7a19.35 19.35 0 0 1-1.81-2.83l8.24-3.689Zm12.432 8.786h.003c.283.402-.047.657-.153.698l-.947.37c.037.125.035.319-.217.414l-.736.287c-.229.09-.398-.059-.42-.2l-.025-.125c-4.427 1.784-7.94 1.685-10.696.647-1.981-.745-3.576-1.983-4.846-3.379l6.948-3.54c.721 1.431 1.586 2.454 2.509 3.178 2.086 1.638 4.415 1.712 5.793 1.563l-.047-.233c-.015-.077.007-.135.086-.165l.734-.288a.302.302 0 0 1 .342.086l.748-.288a.306.306 0 0 1 .341.086l.583.89Z"/></svg><text x="145" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Flask gateway</text><text x="145" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Configuration, projects and media files</text></g><g class="diagram-node" data-node="publishers"  transform="translate(410,84)" style="cursor:pointer"><title>Dependencies and optional model packs are acquired from upstream publishers. The offline runtime requires the corresponding assets to have already been installed or cached.</title><rect class="node-body" width="290" height="110" fill="transparent"/><ellipse class="node-selection" cx="145" cy="29" rx="62" ry="39" fill="none" stroke="#53647e" stroke-width="2" opacity="0"/><path d="M109 54C79 54 84 21 109 22C112-3 154-5 162 19C197 12 211 54 179 54Z" fill="#eef1f6" stroke="#53647e" stroke-width="1.7" stroke-linejoin="round"/><path d="M137 43V25m-7 7 7-7 7 7m-7 11h20" fill="none" stroke="#53647e" stroke-width="2" stroke-linecap="round"/><text x="145" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Package &amp; model sources</text><text x="145" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Explicit installation and acquisition</text></g><g class="diagram-node" data-node="storage"  transform="translate(934,305)" style="cursor:pointer"><title>Uploads, processed artifacts, saved projects, memory databases and personal skills remain outside versioned source. Saved-project references protect media from age-based cleanup.</title><rect class="node-body" width="258" height="128" fill="transparent"/><ellipse class="node-selection" cx="129" cy="29" rx="62" ry="39" fill="none" stroke="#226b53" stroke-width="2" opacity="0"/><path d="M86 15V7H116L124 15H171V55H86Z" fill="#e3f6ee" stroke="#226b53" stroke-width="1.7" stroke-linejoin="round"/><path d="M86 22H171L164 56H86Z" fill="#e3f6ee" stroke="#226b53" stroke-width="1.7" stroke-linejoin="round"/><path d="M115 31H142m-27 8h21m-21 8h14" stroke="#226b53" stroke-width="2" stroke-linecap="round"/><text x="129" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Private local storage</text><text x="129" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Media · projects · memory · skills</text></g><g class="diagram-node" data-node="modelService"  transform="translate(410,548)" style="cursor:pointer"><title>A separately started local service can provide structured planning and optional embeddings. Operators configure the endpoint and served model IDs; no specific model vendor is required.</title><rect class="node-body" width="290" height="110" fill="transparent"/><ellipse class="node-selection" cx="145" cy="29" rx="62" ry="39" fill="none" stroke="#53647e" stroke-width="2" opacity="0"/><path d="M109 54C79 54 84 21 109 22C112-3 154-5 162 19C197 12 211 54 179 54Z" fill="#eef1f6" stroke="#53647e" stroke-width="1.7" stroke-linejoin="round"/><path d="M137 43V25m-7 7 7-7 7 7m-7 11h20" fill="none" stroke="#53647e" stroke-width="2" stroke-linecap="round"/><text x="145" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Local model service</text><text x="145" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">OpenAI-compatible loopback HTTP</text></g><g class="diagram-node" data-node="postgres"  transform="translate(934,84)" style="cursor:pointer"><title>When activity logging is explicitly enabled and database configuration is available, upload metadata can be written to PostgreSQL. The destination is operator-configured.</title><rect class="node-body" width="258" height="128" fill="transparent"/><ellipse class="node-selection" cx="129" cy="29" rx="62" ry="39" fill="none" stroke="#53647e" stroke-wi