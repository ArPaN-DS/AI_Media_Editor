5eaa"/><text x="132.7" y="925" font-size="10" fill="#526985">Application</text><rect x="223.79999999999998" y="918" width="7" height="7" rx="2" fill="#53647e"/><text x="237.79999999999998" y="925" font-size="10" fill="#526985">External / optional</text><rect x="377.69999999999993" y="918" width="7" height="7" rx="2" fill="#226b53"/><text x="391.69999999999993" y="925" font-size="10" fill="#526985">Persistence</text><text x="38" y="957" font-size="10" fill="#526985">“Local” means the application host; a remote browser uploads files to that host.</text></g></svg>