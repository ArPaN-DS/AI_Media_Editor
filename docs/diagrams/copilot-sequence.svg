<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1052" viewBox="0 0 1320 1052" role="img" aria-labelledby="svg-title svg-description"><title id="svg-title">Media Studio — A request becomes a media workflow.</title><desc id="svg-description">Step through the request lifecycle, including optional reasoning and the long-job branch. Select components in the interactive explorer for implementation details.</desc><defs><pattern id="canvas-dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#a9bcd6" opacity=".14"/></pattern><marker id="arrow-client" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#12647b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-gateway" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#3d5eaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-copilot" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#7151ac" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-engine" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#9c4938" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-resource" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#805f15" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-storage" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#226b53" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-external" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#53647e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#eef3fb"/><g font-family="Segoe UI,Helvetica,Arial,sans-serif"><text x="38" y="35" fill="#526985" font-size="11" font-weight="600" letter-spacing="1.2">MEDIA STUDIO / ENGINEERING ATLAS</text><text x="38" y="76" fill="#243b5b" font-size="30" font-weight="650" letter-spacing="-.7">A request becomes a media workflow.</text><text x="38" y="103" fill="#526985" font-size="13">Step through the request lifecycle, including optional reasoning and the long-job branch.</text><g id="scene" transform="translate(0,126)"><rect width="1320" height="850" fill="url(#canvas-dots)"/><text x="38" y="38" fill="#526985" font-size="10" font-weight="500" letter-spacing="1.1">GUIDED REQUEST FLOW</text><text x="1282" y="38" text-anchor="end" fill="#526985" font-size="10">MEDIA STUDIO</text><g class="diagram-region"><path d="M42 123H1278" stroke="#cfdaeb" stroke-width="1"/><text x="44" y="107" font-size="12" font-weight="600" fill="#526985">Understand &amp; validate</text></g><g class="diagram-region"><path d="M42 519H302" stroke="#cfdaeb" stroke-width="1"/><text x="44" y="503" font-size="12" font-weight="600" fill="#526985">Optional inference</text></g><g class="diagram-region"><path d="M356 519H1278" stroke="#cfdaeb" stroke-width="1"/><text x="358" y="503" font-size="12" font-weight="600" fill="#526985">Execute &amp; deliver</text></g><g id="connections"><g class="diagram-edge" data-from="upload" data-to="request"><path d="M240,200 L436,200" fill="none" stroke="#12647b" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-client)"/></g><g class="diagram-edge" data-from="request" data-to="planner"><path d="M550,200 L746,200" fill="none" stroke="#3d5eaa" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-gateway)"/></g><g class="diagram-edge" data-from="planner" data-to="validate"><path d="M860,200 L1056,200" fill="none" stroke="#7151ac" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-copilot)"/></g><g class="diagram-edge" data-from="planner" data-to="memory"><path d="M803,284 L803,313" fill="none" stroke="#7151ac" stroke-opacity=".75" stroke-width="1.65" stroke-dasharray="5 6" marker-end="url(#arrow-copilot)"/></g><g class="diagram-edge" data-from="validate" data-to="confirm"><path d="M1113,284 L1113,503" fill="none" stroke="#7151ac" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-copilot)"/><rect x="1079.35" y="392" width="67.30000000000001" height="19" rx="4" fill="#eef3fb"/><text x="1113" y="405" text-anchor="middle" font-size="9.5" fill="#526985">Long edit</text></g><g class="diagram-edge" data-from="validate" data-to="executor"><path d="M1056,200 L971,200 Q959,200 959,212 L959,528 Q959,540 947,540 L860,540" fill="none" stroke="#7151ac" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-copilot)"/><rect x="910.5" y="432" width="73" height="19" rx="4" fill="#eef3fb"/><text x="947" y="445" text-anchor="middle" font-size="9.5" fill="#526985">Short edit</text></g><g class="diagram-edge" data-from="confirm" data-to="executor"><path d="M1056,540 L860,540" fill="none" stroke="#3d5eaa" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-gateway)"/></g><g class="diagram-edge" data-from="executor" data-to="artifacts"><path d="M746,540 L550,540" fill="none" stroke="#9c4938" stroke-opacity=".75" stroke-width="1.65"  marker-end="url(#arrow-engine)"/></g><g class="diagram-edge" data-from="planner" data-to="reasoning"><path d="M803,163 L803,68 Q803,56 791,56 L54,56 Q42,56 42,68 L42,528 Q42,540 54,540 L126,540" fill="none" stroke="#7151ac" stroke-opacity=".75" stroke-width="1.65" stroke-dasharray="5 6" marker-end="url(#arrow-copilot)"/><rect x="363.6" y="32" width="152.8" height="19" rx="4" fill="#eef3fb"/><text x="440" y="45" text-anchor="middle" font-size="9.5" fill="#526985">Optional local reasoning</text></g></g><g id="components"><g class="diagram-node" data-node="upload"  transform="translate(60,170)" style="cursor:pointer"><title>Select media in the browser and upload it through ordinary multipart upload or the chunk-upload sequence. The application supplies a local media identifier and relevant inspection context.</title><rect class="node-body" width="246" height="110" fill="transparent"/><ellipse class="node-selection" cx="123" cy="29" rx="62" ry="39" fill="none" stroke="#12647b" stroke-width="2" opacity="0"/><rect x="75" y="2" width="96" height="55" rx="5" fill="#e3f5fb" stroke="#12647b" stroke-width="1.7" stroke-linejoin="round"/><path d="M75 15H171" stroke="#12647b" stroke-width="1.3"/><circle cx="84" cy="9" r="1.6" fill="#12647b"/><circle cx="90" cy="9" r="1.6" fill="#12647b"/><circle cx="96" cy="9" r="1.6" fill="#12647b"/><svg x="110" y="23" width="26" height="26" viewBox="0 0 24 24" fill="#12647b" aria-hidden="true"><path d="M1.5 0h21l-1.91 21.563L11.977 24l-8.564-2.438L1.5 0zm7.031 9.75l-.232-2.718 10.059.003.23-2.622L5.412 4.41l.698 8.01h9.126l-.326 3.426-2.91.804-2.955-.81-.188-2.11H6.248l.33 4.171L12 19.351l5.379-1.443.744-8.157H8.531z"/></svg><text x="123" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Select &amp; upload</text><text x="123" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Media identifier + inspected context</text></g><g class="diagram-node" data-node="request"  transform="translate(370,170)" style="cursor:pointer"><title>Accepts a user message, optional filename, media context, history and session identifier. Internal context keys are resolved by the server.</title><rect class="node-body" width="246" height="110" fill="transparent"/><ellipse class="node-selection" cx="123" cy="29" rx="62" ry="39" fill="none" stroke="#3d5eaa" stroke-width="2" opacity="0"/><svg x="96" y="5" width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#3d5eaa" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h7v14H4m9-10 4 3-4 3m4-3H8m12-8v16"/></svg><text x="123" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Chat request</text><text x="123" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">POST /api/agent/chat</text></g><g class="diagram-node" data-node="planner"  transform="translate(680,170)" style="cursor:pointer"><title>Expands workflow skills, parses local intent and optionally asks a loopback model for a structured plan. Python validates tool names, arguments, media compatibility and step dependencies before execution.</title><rect class="node-body" width="246" height="110" fill="transparent"/><ellipse class="node-selection" cx="123" cy="29" rx="62" ry="39" fill="none" stroke="#7151ac" stroke-width="2" opacity="0"/><svg x="97" y="5" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#7151ac" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-5h14v5"/></svg><text x="123" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Copilot planner</text><text x="123" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Intent → validated dependency graph</text></g><g class="diagram-node" data-node="validate"  transform="translate(990,170)" style="cursor:pointer"><title>Normalize tool names and structured plan fields, enforce parameter constraints, check media compatibility and preserve explicit input dependencies.</title><rect class="node-body" width="246" height="110" fill="transparent"/><ellipse class="node-selection" cx="123" cy="29" rx="62" ry="39" fill="none" stroke="#7151ac" stroke-width="2" opacity="0"/><circle cx="123" cy="29" r="27" fill="#f0eaff" stroke="#7151ac" stroke-width="1.7" stroke-linejoin="round"/><path d="m110 29 9 9 18-20" fill="none" stroke="#7151ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="123" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Validate the plan</text><text x="123" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Tools, parameters, units and media</text></g><g class="diagram-node" data-node="memory"  transform="translate(680,320)" style="cursor:pointer"><title>Built-in Markdown workflows expand into validated plans. Optional persistent memory combines SQLite FTS5 and vector retrieval to recall preferences and previous edits.</title><rect class="node-body" width="246" height="110" fill="transparent"/><ellipse class="node-selection" cx="123" cy="29" rx="62" ry="39" fill="none" stroke="#7151ac" stroke-width="2" opacity="0"/><path d="M83 13V46C83 62 163 62 163 46V13" fill="#f0eaff" stroke="#7151ac" stroke-width="1.7" stroke-linejoin="round"/><ellipse cx="123" cy="13" rx="40" ry="10" fill="#f0eaff" stroke="#7151ac" stroke-width="1.7" stroke-linejoin="round"/><path d="M83 31C83 46 163 46 163 31" fill="none" stroke="#7151ac" stroke-opacity=".45"/><svg x="111" y="25" width="25" height="25" viewBox="0 0 24 24" fill="#116c9e" aria-hidden="true"><path d="M21.678.521c-1.032-.92-2.28-.55-3.513.544a8.71 8.71 0 0 0-.547.535c-2.109 2.237-4.066 6.38-4.674 9.544.237.48.422 1.093.544 1.561a13.044 13.044 0 0 1 .164.703s-.019-.071-.096-.296l-.05-.146a1.689 1.689 0 0 0-.033-.08c-.138-.32-.518-.995-.686-1.289-.143.423-.27.818-.376 1.176.484.884.778 2.4.778 2.4s-.025-.099-.147-.442c-.107-.303-.644-1.244-.772-1.464-.217.804-.304 1.346-.226 1.478.152.256.296.698.422 1.186.286 1.1.485 2.44.485 2.44l.017.224a22.41 22.41 0 0 0 .056 2.748c.095 1.146.273 2.13.5 2.657l.155-.084c-.334-1.038-.47-2.399-.41-3.967.09-2.398.642-5.29 1.661-8.304 1.723-4.55 4.113-8.201 6.3-9.945-1.993 1.8-4.692 7.63-5.5 9.788-.904 2.416-1.545 4.684-1.931 6.857.666-2.037 2.821-2.912 2.821-2.912s1.057-1.304 2.292-3.166c-.74.169-1.955.458-2.362.629-.6.251-.762.337-.762.337s1.945-1.184 3.613-1.72C21.695 7.9 24.195 2.767 21.678.521m-18.573.543A1.842 1.842 0 0 0 1.27 2.9v16.608a1.84 1.84 0 0 0 1.835 1.834h9.418a22.953 22.953 0 0 1-.052-2.707c-.006-.062-.011-.141-.016-.2a27.01 27.01 0 0 0-.473-2.378c-.121-.47-.275-.898-.369-1.057-.116-.197-.098-.31-.097-.432 0-.12.015-.245.037-.386a9.98 9.98 0 0 1 .234-1.045l.217-.028c-.017-.035-.014-.065-.031-.097l-.041-.381a32.8 32.8 0 0 1 .382-1.194l.2-.019c-.008-.016-.01-.038-.018-.053l-.043-.316c.63-3.28 2.587-7.443 4.8-9.791.066-.069.133-.128.198-.194Z"/></svg><text x="123" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Skills &amp; memory</text><text x="123" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Workflows, preferences and retrieval</text></g><g class="diagram-node" data-node="confirm"  transform="translate(990,510)" style="cursor:pointer"><title>For selected long AI operations, chat asks the user whether to start a background job. The browser submits the plan and polls the returned identifier.</title><rect class="node-body" width="246" height="110" fill="transparent"/><ellipse class="node-selection" cx="123" cy="29" rx="62" ry="39" fill="none" stroke="#3d5eaa" stroke-width="2" opacity="0"/><circle cx="123" cy="29" r="27" fill="#e9efff" stroke="#3d5eaa" stroke-width="1.7" stroke-linejoin="round"/><path d="m110 29 9 9 18-20" fill="none" stroke="#3d5eaa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="123" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Confirm long edit</text><text x="123" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Submit → job ID → poll status</text></g><g class="diagram-node" data-node="executor"  transform="translate(680,510)" style="cursor:pointer"><title>Four Python sub-agent classes dispatch approved operations, revalidate actual inputs, verify selected outputs and preserve main-chain and branch artifacts.</title><rect class="node-body" width="246" height="110" fill="transparent"/><ellipse class="node-selection" cx="123" cy="29" rx="62" ry="39" fill="none" stroke="#9c4938" stroke-width="2" opacity="0"/><path d="M123 25V8m0 17-27 20m27-20 27 20" fill="none" stroke="#9c4938" stroke-width="2"/><circle cx="123" cy="27" r="11" fill="#fff0eb" stroke="#9c4938" stroke-width="1.7" stroke-linejoin="round"/><circle cx="123" cy="5" r="6" fill="#fff0eb" stroke="#9c4938" stroke-width="1.7" stroke-linejoin="round"/><circle cx="95" cy="48" r="7" fill="#fff0eb" stroke="#9c4938" stroke-width="1.7" stroke-linejoin="round"/><circle cx="151" cy="48" r="7" fill="#fff0eb" stroke="#9c4938" stroke-width="1.7" stroke-linejoin="round"/><text x="123" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Specialist execution</text><text x="123" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Audio · Video · Vision · Inspector</text></g><g class="diagram-node" data-node="artifacts"  transform="translate(370,510)" style="cursor:pointer"><title>Return the main-chain output separately from branch exports such as stems, transcripts or thumbnails. The browser previews or downloads files from the processed-media endpoint.</title><rect class="node-body" width="246" height="110" fill="transparent"/><ellipse class="node-selection" cx="123" cy="29" rx="62" ry="39" fill="none" stroke="#226b53" stroke-width="2" opacity="0"/><path d="M80 15V7H110L118 15H165V55H80Z" fill="#e3f6ee" stroke="#226b53" stroke-width="1.7" stroke-linejoin="round"/><path d="M80 22H165L158 56H80Z" fill="#e3f6ee" stroke="#226b53" stroke-width="1.7" stroke-linejoin="round"/><path d="M109 31H136m-27 8h21m-21 8h14" stroke="#226b53" stroke-width="2" stroke-linecap="round"/><text x="123" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Preview &amp; download</text><text x="123" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Main output + side artifacts</text></g><g class="diagram-node" data-node="reasoning"  transform="translate(60,510)" style="cursor:pointer"><title>Selects relevant tools and examples, budgets prompt context, validates structured model responses and walks a configured model-tier ladder. Local intent routing remains available when the model service is unavailable.</title><rect class="node-body" width="246" height="110" fill="transparent"/><ellipse class="node-selection" cx="123" cy="29" rx="62" ry="39" fill="none" stroke="#7151ac" stroke-width="2" opacity="0"/><svg x="97" y="5" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#7151ac" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-5h14v5"/></svg><text x="123" y="77" text-anchor="middle" fill="#243b5b" font-size="15" font-weight="600">Reasoning client</text><text x="123" y="94" text-anchor="middle" fill="#4a5d78" font-size="10">Prompt budgets, schemas and fallback</text></g></g></g><rect x="38" y="998" width="7" height="7" rx="2" fill="#12647b"/><text x="52" y="1005" font-size="10" fill="#526985">Browser</text><rect x="118.69999999999999" y="998" width="7" height="7" rx="2" fill="#3d5eaa"/><text x="132.7" y="1005" font-size="10" fill="#526985">Application</text><rect x="223.79999999999998" y="998" width="7" height="7" rx="2" fill="#7151ac"/><text x="237.79999999999998" y="1005" font-size="10" fill="#526985">Intelligence</text><rect x="335" y="998" width="7" height="7" rx="2" fill="#9c4938"/><text x="349" y="1005" font-size="10" fill="#526985">Media engine</text><rect x="446.2" y="998" width="7" height="7" rx="2" fill="#226b53"/><text x="460.2" y="1005" font-size="10" fill="#526985">Persistence</text><text x="38" y="1037" font-size="10" fill="#526985">Short edits run in-request. Selected long edits use user confirmation, threads and JSON polling.</text></g></svg>